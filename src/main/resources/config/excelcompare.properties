
# =====================================================================
# Excel Comparison Service configuration
# =====================================================================
# Directories scanned for Excel files.

app.files.excelcompare.source-directory=./data/source
app.files.excelcompare.target-directory=./data/target

## sheets level configuration
## The sheet key can be either the sheet name (e.g. Sheet1) or its 1-based position
## in the workbook (e.g. 1, 2, 3). A purely numeric key is treated as a sheet index.
app.files.recon.customer.1.unique-row-key=uniqueId,Name
app.files.recon.customer.1.ignore-columns=CreatedDate,UpdatedDate,name
app.files.recon.customer.1.header-row-index=2

app.files.recon.order.1.unique-row-key=uniqueId,Name
app.files.recon.order.1.ignore-columns=CreatedDate,UpdatedDate,name
app.files.recon.order.1.header-row-index=2
