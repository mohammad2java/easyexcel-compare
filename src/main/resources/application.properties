spring.application.name=easyexcelcomparator

# =====================================================================
# Excel Comparison Service configuration
# =====================================================================
# Directories scanned for Excel files.
excelcompare.source-directory=./data/source
excelcompare.target-directory=./data/target

# Per-file / per-sheet comparison settings.
#   <filename>.<sheetName>.key=<uniqueKeyColumnHeader>
#   <filename>.<sheetName>.ignore-columns=<col1>,<col2>,...
#
# Only sheets having a 'key' entry are compared. Columns listed in
# 'ignore-columns' are excluded from the comparison.
# NOTE: <sheetName> must match the sheet name used in the Excel file exactly
# (case-sensitive), otherwise the sheet is reported as NOT_CONFIGURED and skipped.
customer.xlsx.Sheet1.key=uniqueId
customer.xlsx.Sheet1.ignore-columns=CreatedDate,UpdatedDate,name

order.xlsx.Order.key=OrderId
order.xlsx.Order.ignore-columns=CreatedDate,UpdatedDate,GeneratedTimestamp
